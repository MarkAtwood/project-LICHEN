# Swarm merge convention (bead fejd): one feature per line; insert new
# [dependencies]/[dev-dependencies] entries ALPHABETICALLY. Keeps parallel
# agent merges conflict-free. Do not collapse arrays to single-line.

[package]
name = "lichen-tui"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "LICHEN terminal user interface — ratatui dashboard for mesh nodes."

[[bin]]
name = "lichen-tui"
path = "src/main.rs"

[dependencies]
lichen-core   = { path = "../lichen-core" }
lichen-client = { path = "../lichen-client" }
lichen-coap   = { path = "../lichen-coap", features = ["tokio"] }

clap      = { version = "4", features = ["derive", "env"] }
ratatui   = "0.30"
crossterm = "0.29"
tokio     = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
