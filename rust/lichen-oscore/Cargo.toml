[package]
name = "lichen-oscore"
description = "OSCORE (RFC 8613) implementation for LICHEN"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# Core OSCORE implementation - re-exported with LICHEN-specific integration
oscore = { version = "0.1", default-features = false }

# Re-export heapless for public API types
heapless = "0.8"

# Constant-time comparison for cryptographic operations
subtle = { version = "2", default-features = false }

# SHA-256 for EDHOC transcript hashes (RFC 9528 Suite 0)
# `zeroize` (digest/zeroize) makes hasher state ZeroizeOnDrop.
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }

# Direct `zeroize`-feature pins for the AES/HMAC primitives used (transitively)
# by the `oscore` crate. Feature unification guarantees their owned key
# material is zeroized regardless of the `oscore` patch: `aes/zeroize` makes
# Aes128 `ZeroizeOnDrop`; `hmac/zeroize` enables `digest/zeroize` (the
# key-derived HMAC pad cores and tag output are `ZeroizeOnDrop` — the `Hmac`
# wrapper itself is not marked upstream). Types are also referenced by the
# compile-time assertions in src/zeroize_asserts.rs.
aes = { version = "0.8", default-features = false, features = ["zeroize"] }
hmac = { version = "0.13", default-features = false, features = ["zeroize"] }

# Zeroization guarantees for owned key material (used by compile-time
# assertions in src/zeroize_asserts.rs).
zeroize = { version = "1.8", default-features = false }

# Logging backends (optional, feature-gated)
defmt = { version = "0.3", optional = true }
log = { version = "0.4", default-features = false, optional = true }

[dev-dependencies]
hex-literal = "0.4"
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
rand_core = { version = "0.6", default-features = false, features = ["getrandom", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = { version = "1.8", default-features = false }
# For deriving public keys from seeds in EDHOC test vectors
schnorr48 = { version = "0.1", default-features = false }

[features]
default = []
std = [
    "oscore/std",
]
# EDHOC Suite 0 (RFC 9528) for establishing OSCORE contexts
# Uses Schnorr48 (48B signatures) to match LICHEN link-layer
edhoc = [
    "oscore/edhoc-schnorr48",
]
# Logging: enable one or neither, not both
defmt = [
    "dep:defmt",
    "oscore/defmt",
]
log = [
    "dep:log",
    "oscore/log",
]
