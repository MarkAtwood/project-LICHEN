# native_sim board config — overrides / supplements prj.conf

# LoRa loopback driver for testing without external simulator
CONFIG_LORA=y
CONFIG_LORA_LOOPBACK=y
CONFIG_LICHEN_HAS_LORA=y
CONFIG_LICHEN_RADIO_MODEL_LOOPBACK=y

# Alternatively, use the simulator driver (requires lichen-sim running):
# CONFIG_LORA_LICHEN_SIM=y
# CONFIG_LORA_LICHEN_SIM_HOST="127.0.0.1"
# CONFIG_LORA_LICHEN_SIM_PORT=4444
# CONFIG_LORA_LICHEN_SIM_NODE_ID="gw0"
# CONFIG_LORA_LICHEN_SIM_SIM_ID="lichen"
# CONFIG_NET_SOCKETS=y
# CONFIG_NET_SOCKETS_POSIX_NAMES=y

# native_sim uses the LoRa loopback/simulator driver, not Zephyr SLIP/TAP.
CONFIG_SLIP=n

# No SLIP transport on native_sim -> no LICHEN_COAP_KEYS (it requires the
# SLIP transport for admin scoping), and the subsys /config resource module
# (coap_config.c) cannot link without KEYS' local-admin/fingerprint helpers.
# Mirror native_posix_ble_ingress.conf and drop the resource module here;
# the app-local config_apply/config_cbor paths are unaffected.
CONFIG_LICHEN_COAP_CONFIG=n

# GNSS: use emulated driver for native_sim (no UART dependency)
# For real hardware, boards use gnss-nmea-generic with MODEM_BACKEND_UART.
CONFIG_GNSS=y
CONFIG_GNSS_EMUL=y

# Entropy driver for CSPRNG (native_sim uses zephyr,native-posix-rng)
CONFIG_ENTROPY_GENERATOR=y
