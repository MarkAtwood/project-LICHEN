common:
  # R-APPC-009 (spec/appendix-c-safety.md): ASan+UBSan on native_sim builds.
  extra_conf_files:
    - ../../tests/sanitizers.conf
tests:
  lichen.checkin_resource:
    tags:
      - coap
      - checkin
      - rollcall
    platform_allow:
      - native_sim
      - native_sim/native/64
      - qemu_x86
      - qemu_x86_64
    integration_platforms:
      - qemu_x86
      - qemu_x86_64
