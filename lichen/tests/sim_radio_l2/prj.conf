CONFIG_ZVFS_OPEN_MAX=8
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD_DISPATCHER=y
CONFIG_NET_INTERFACE_NAME=y
CONFIG_NET_IF_MAX_IPV6_COUNT=4
CONFIG_NET_CONTEXT_RCVTIMEO=y
CONFIG_ETH_NATIVE_POSIX=n
CONFIG_LICHEN=y
CONFIG_LICHEN_HAS_LORA=y
CONFIG_LICHEN_CRYPTO_MONOCYPHER=y
CONFIG_LICHEN_LINK=y
CONFIG_LICHEN_L2=y
CONFIG_LICHEN_L2_TEST_HOOKS=y
CONFIG_LORA=y
CONFIG_LORA_LICHEN_SIM=y
CONFIG_COAP_SERVER_MESSAGE_SIZE=1024
CONFIG_COAP_CLIENT_THREAD_PRIORITY=14
CONFIG_ZCBOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_LOG=y
CONFIG_ASSERT=y
CONFIG_STACK_SENTINEL=y
CONFIG_STACK_CANARIES=y
CONFIG_SYS_HEAP_VALIDATE=y
