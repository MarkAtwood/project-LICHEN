common:
  # R-APPC-009 (spec/appendix-c-safety.md): ASan+UBSan on native_sim builds.
  extra_conf_files:
    - ../../tests/sanitizers.conf
tests:
  net.lichen.gnss_emul:
    tags:
      - net
      - lichen
      - gnss
      - simulation
    platform_allow:
      - native_sim
      - native_sim/native/64
      - qemu_x86
      - qemu_x86_64
    integration_platforms:
      - qemu_x86
    timeout: 30
