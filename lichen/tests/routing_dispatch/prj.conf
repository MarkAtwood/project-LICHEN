CONFIG_ZTEST=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=8192

CONFIG_LICHEN=y
CONFIG_LICHEN_ROUTING=y
CONFIG_LICHEN_ROUTER=y
CONFIG_LICHEN_ROUTER_DTN_BUFFER_SIZE=1024
CONFIG_LICHEN_ROUTER_DTN_MAX_MESSAGES=4
CONFIG_ASSERT=y
CONFIG_ASSERT_VERBOSE=y
CONFIG_STACK_CANARIES=y
CONFIG_STACK_SENTINEL=y

# No CONFIG_THREAD_ANALYZER here: it depends on !ARCH_POSIX and this suite
# only builds on native_sim, so assigning it aborts the Kconfig merge
# (project-LICHEN-worker6-52yd). R-APPC-007 applies to hardware builds.

# Spec appendix-c R-APPC-008: heap validation in debug builds (DTN buffer path)
CONFIG_SYS_HEAP_VALIDATE=y
