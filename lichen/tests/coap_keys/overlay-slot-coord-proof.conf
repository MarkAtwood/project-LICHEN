# Compile/link proof overlay for CONFIG_LICHEN_COAP_SLOT_COORD (bd
# project-LICHEN-worker6-6gz2). No in-tree test enables the slot-coord
# resource, so this pulls in its full dependency chain on top of prj.conf:
#   LICHEN_COAP_SLOT_COORD depends on LICHEN_COAP_SERVER + LICHEN_LINK_SCHNORR
#   + LICHEN_COAP_KEYS + LICHEN_CCP_TIME_SYNC (needs CCP16 load balancing),
#   and its replay store uses SETTINGS. Build with:
#     west build -b native_sim/native/64 \
#       -DEXTRA_CONF_FILE=overlay-slot-coord-proof.conf
#     west build -t run   # coap_keys 37 tests must still pass

# CCP16 chain pulls in RPL routing (time sync drives RPL version interplay)
CONFIG_LICHEN_ROUTING=y
CONFIG_LICHEN_RPL=y
CONFIG_LICHEN_LINK_EPOCH_PERSIST=y
CONFIG_LICHEN_LINK_CCP16_LOAD_BALANCING=y
CONFIG_LICHEN_CCP_TIME_SYNC=y
# Slot-claim replay persistence (GCP-6.5 step 8) uses Settings/NVS.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
# The subject under test.
CONFIG_LICHEN_COAP_SLOT_COORD=y
CONFIG_LICHEN_COAP_SLOT_COORD_RESOURCE=y
