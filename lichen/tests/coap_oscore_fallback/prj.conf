CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_LOG=y
CONFIG_PRINTK=y

CONFIG_NETWORKING=y
CONFIG_NET_TEST=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_NET_IPV6=y
CONFIG_NET_IPV4=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_IF_MAX_IPV6_COUNT=2
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_NET_IPV6_DAD=n
CONFIG_NET_IPV6_ND=n
CONFIG_NET_IPV6_NBR_CACHE=n
CONFIG_NET_IPV6_MLD=n

CONFIG_COAP=y
CONFIG_COAP_SERVER=y
CONFIG_COAP_SERVICE_PENDING_MESSAGES=2
CONFIG_COAP_SERVICE_OBSERVERS=1

CONFIG_LICHEN=y
CONFIG_LICHEN_COAP=y
CONFIG_LICHEN_COAP_SERVER=y
CONFIG_LICHEN_COAP_CLIENT=n
# No client thread in this test (its default priority 15 panics on
# native_sim's 15-priority preempt range).
CONFIG_LICHEN_COAP_STATUS=n
# Not under test. lichen_rollcall_render() exceeds this host toolchain's
# -Wstack-usage=2048 limit (3424B on x86_64-zephyr-elf gcc) and this suite
# does not exercise it (pre-existing, tracked separately).
CONFIG_LICHEN_CHECKIN=n
# LICHEN_COAP_SERVER scopes admin access to the SLIP LCI interface, so that
# must be present for the module to compile and link (see coap_keys).
CONFIG_LICHEN_SLIP_TRANSPORT=y
CONFIG_SERIAL=y
CONFIG_RING_BUFFER=y
CONFIG_LICHEN_OSCORE=y
CONFIG_LICHEN_COAP_SERVER_OSCORE=y
CONFIG_LICHEN_LINK=y

CONFIG_TINYCRYPT=y
CONFIG_TINYCRYPT_SHA256=y

# C Safety Policy - spec/appendix-c-safety.md
CONFIG_STACK_CANARIES=y
CONFIG_STACK_SENTINEL=y
CONFIG_ASSERT=y
CONFIG_ASSERT_VERBOSE=y
