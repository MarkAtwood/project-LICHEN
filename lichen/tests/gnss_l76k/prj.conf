CONFIG_SERIAL=y
CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=2048

CONFIG_LOG=y
CONFIG_GNSS=y
CONFIG_GNSS_LOG_LEVEL_DBG=y
CONFIG_PM_DEVICE=y

CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_MODEM_MODULES=y
CONFIG_MODEM_BACKEND_UART=y
CONFIG_MODEM_CHAT=y

CONFIG_MAIN_STACK_SIZE=2048

# C Safety Policy - spec/appendix-c-safety.md
# STACK_SENTINEL only: STACK_CANARIES is an exclusive choice sibling and
# selecting both aborts the Kconfig run.
CONFIG_STACK_SENTINEL=y
CONFIG_ASSERT=y
CONFIG_ASSERT_VERBOSE=y

# Thread stack analysis (spec appendix-c-safety.md:169-172, CI and debug builds)
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_THREAD_ANALYZER_AUTO=n
# System heap validation (spec appendix-c-safety.md R-APPC-008, debug builds)
CONFIG_SYS_HEAP_VALIDATE=y
