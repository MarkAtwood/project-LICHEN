common:
  tags:
    - lichen
    - gateway
    - lci
    - location
  # R-APPC-009 (spec/appendix-c-safety.md): ASan+UBSan on native_sim builds.
  extra_conf_files:
    - ../../tests/sanitizers.conf
tests:
  net.lichen.inbound_lci_location.native:
    platform_allow:
      - native_sim
      - native_sim/native/64
    integration_platforms:
      - native_sim
      - native_sim/native/64
  net.lichen.inbound_lci_location.qemu:
    platform_allow:
      - qemu_x86
    integration_platforms:
      - qemu_x86
    extra_configs:
      - CONFIG_NET_TEST=y
