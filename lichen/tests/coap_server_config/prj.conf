CONFIG_ZTEST=y
CONFIG_LICHEN=y
CONFIG_LICHEN_LINK=y
CONFIG_LICHEN_LINK_SCHNORR=y
# Compile and drive the standalone coap_server so its /config PUT
# authorization gate (coap_server.c config_put) is exercised here. The
# standalone server needs the SLIP transport, which needs the net stack.
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_SERIAL=y
CONFIG_NET_L2_DUMMY=y
# coap_server.c BUILD_ASSERTs require >= LICHEN_COAP_SERVER_MAX_PAYLOAD (512) + 128
CONFIG_COAP_SERVER_MESSAGE_SIZE=896
CONFIG_LICHEN_COAP=y
# No client thread in this test (its default priority 15 panics on
# native_sim's 15-priority preempt range).
CONFIG_LICHEN_COAP_CLIENT=n
CONFIG_LICHEN_COAP_SERVER=y
CONFIG_LICHEN_COAP_SERVER_STANDALONE=y
CONFIG_LICHEN_COAP_SERVER_OSCORE=y
CONFIG_LICHEN_COAP_KEYS=y
CONFIG_LICHEN_OSCORE=y
CONFIG_LICHEN_SLIP_TRANSPORT=y
CONFIG_LICHEN_SENML=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_ASSERT=y

# No CONFIG_THREAD_ANALYZER here: it depends on !ARCH_POSIX and this suite
# only builds on native_sim, so assigning it aborts the Kconfig merge
# (project-LICHEN-worker6-52yd). R-APPC-007 applies to hardware builds.

# System heap validation (spec appendix-c-safety.md R-APPC-008, debug builds)
CONFIG_SYS_HEAP_VALIDATE=y
