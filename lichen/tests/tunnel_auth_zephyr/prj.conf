CONFIG_ZTEST=y
CONFIG_LICHEN=y
CONFIG_LICHEN_LINK=y
CONFIG_LICHEN_LINK_SCHNORR=y
CONFIG_LICHEN_TUNNEL_AUTH=y
CONFIG_LICHEN_TUNNEL_AUTH_MAX_ENTRIES=2
CONFIG_LICHEN_TUNNEL_AUTH_MAX_HISTORY=4
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_ASSERT=y

# Thread stack analysis (spec appendix-c-safety.md:169-172, "CI and debug builds")
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_THREAD_ANALYZER_AUTO=n
