CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=2048

CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_LICHEN=y
CONFIG_ZCBOR=y
# No CONFIG_LICHEN_NATIVE here: it depends on UART_INTERRUPT_DRIVEN, which
# native_sim cannot satisfy (ptty driver lacks SERIAL_SUPPORT_INTERRUPT), so
# the assignment would silently fall back to n (project-LICHEN-worker6-5zbn).
# The suite compiles lib/native/native.c directly instead (see CMakeLists.txt).

CONFIG_MAIN_STACK_SIZE=2048

# C Safety Policy - spec/appendix-c-safety.md
CONFIG_STACK_CANARIES=y
CONFIG_STACK_SENTINEL=y
CONFIG_ASSERT=y
CONFIG_ASSERT_VERBOSE=y

# No CONFIG_THREAD_ANALYZER here: it depends on !ARCH_POSIX and this suite
# only builds on native_sim, so assigning it aborts the Kconfig merge
# (project-LICHEN-worker6-52yd). R-APPC-007 applies to hardware builds.

# System heap validation (spec appendix-c-safety.md R-APPC-008, debug builds)
CONFIG_SYS_HEAP_VALIDATE=y
