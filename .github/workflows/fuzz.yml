name: Fuzzing

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Run nightly at 3am UTC for deep fuzzing
    - cron: '0 3 * * *'

jobs:
  python-hypothesis:
    name: Python property-based testing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install "uv>=0.11,<0.12"
          uv sync --locked --all-extras --dev

      - name: Run hypothesis tests with extended examples
        run: |
          # Run property-based tests with more examples on schedule
          if [ "${{ github.event_name }}" = "schedule" ]; then
            uv run pytest tests/ -v --hypothesis-profile=ci-extended -k "hypothesis or property" --timeout=300
          else
            uv run pytest tests/ -v -k "hypothesis or property" --timeout=120
          fi

  rust-fuzz:
    name: Rust fuzzing (cargo-fuzz)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Fuzz SCHC decompression (5 min)
        working-directory: rust/lichen-schc
        run: |
          if [ -d fuzz ]; then
            cargo +nightly fuzz run fuzz_decompress -- -max_total_time=300
          else
            echo "No fuzz targets in lichen-schc"
          fi
        continue-on-error: true

      - name: Fuzz CBOR parsing (5 min)
        working-directory: rust/lichen-coap
        run: |
          if [ -d fuzz ]; then
            cargo +nightly fuzz run fuzz_cbor -- -max_total_time=300
          else
            echo "No fuzz targets in lichen-coap"
          fi
        continue-on-error: true

      - name: Fuzz link frame parsing (5 min)
        working-directory: rust/lichen-link
        run: |
          if [ -d fuzz ]; then
            cargo +nightly fuzz run fuzz_frame -- -max_total_time=300
          else
            echo "No fuzz targets in lichen-link"
          fi
        continue-on-error: true

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: rust/*/fuzz/artifacts/

  zephyr-fuzz:
    name: Parser fuzzing (host, ASan/UBSan)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: sudo apt-get install -y --no-install-recommends clang cmake ninja-build

      # R-APPC-013 (spec/appendix-c-safety.md): parsers of untrusted input
      # (frame.c, schnorr48.c, schc.c) are fuzzed here. lichen/tests/fuzz is
      # a standalone host CMake project — not a Zephyr app, so west twister
      # discovers no tests for it. The harnesses build with
      # -fsanitize=address,undefined (the sanitizers.conf ASAN/UBSAN policy,
      # R-APPC-009, applied to these host binaries).
      - name: Build fuzz harnesses
        run: |
          cmake lichen/tests/fuzz -B build-fuzz -G Ninja -DCMAKE_C_COMPILER=clang \
            -DLICHEN_FUZZ_FORCE_STANDALONE=ON
          cmake --build build-fuzz

      # Standalone drivers take "iterations seed"; the seed varies per run
      # (github.run_number, visible in the run UI) so nightly exploration
      # differs while any failure is replayable with the logged seed.
      - name: Run fuzz harnesses
        env:
          FUZZ_SEED: ${{ github.run_number }}
        run: |
          echo "fuzz seed: $FUZZ_SEED"
          ./build-fuzz/fuzz_frame 50000 "$FUZZ_SEED"
          ./build-fuzz/fuzz_schnorr48 50000 "$FUZZ_SEED"
          ./build-fuzz/fuzz_schc 50000 "$FUZZ_SEED"
        timeout-minutes: 15

      - name: Upload build for failure reproduction
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-fuzz-build
          path: build-fuzz/

  integration-stress:
    name: Integration stress tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install "uv>=0.11,<0.12"
          uv sync --locked --all-extras --dev

      - name: Run stress tests (extended timeouts)
        run: |
          # Run integration tests with stress markers
          uv run pytest tests/sim/ tests/integration/ -v \
            --timeout=600 \
            -m "stress or slow" \
            --tb=short
        continue-on-error: true
        timeout-minutes: 30
